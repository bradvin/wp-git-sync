name: Build Plugin ZIP

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Build ZIP
        id: build
        run: |
          set -euo pipefail

          PLUGIN_SLUG="$(basename "$GITHUB_WORKSPACE")"
          ZIP_PATH="$GITHUB_WORKSPACE/dist/${PLUGIN_SLUG}.zip"

          bash "$GITHUB_WORKSPACE/scripts/build-zip.sh"
          echo "plugin_slug=$PLUGIN_SLUG" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.plugin_slug }}-zip
          path: ${{ steps.build.outputs.zip_path }}
          if-no-files-found: error
